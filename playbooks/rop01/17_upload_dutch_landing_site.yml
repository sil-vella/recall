---
# Upload static landing to Dutch nginx docroot only (prefixed paths, not generic /css/ or /js/).
# Replaces: index.html, app-ads.txt, .well-known/, gotoapp/, static_landing_* trees.
# Does NOT modify: downloads/, app_media/, sim_players/, or any other paths.
#
# Nginx: /.well-known/ + /gotoapp/ static; /rl/<CODE> → 302 /?ref=<CODE> — see website/README.md
# Referral flow: Shlink /rl/CODE → landing ?ref= → GET BONUS COINS → /gotoapp/CODE → app
#
#   ansible-playbook -i playbooks/rop01/inventory.ini playbooks/rop01/17_upload_dutch_landing_site.yml -e vm_name=rop01
#
- name: Upload Dutch static landing (index + well-known + referral + static_landing_*)
  hosts: "{{ vm_name | default('rop01') }}_user"
  become: true
  vars:
    dutch_web_root: "{{ dutch_landing_web_root | default('/var/www/dutch.reignofplay.com') }}"
    landing_src: "{{ playbook_dir }}/../../website"
  tasks:
    - name: Stat local website sources
      ansible.builtin.stat:
        path: "{{ landing_src }}/index.html"
      register: landing_index
      delegate_to: localhost
      connection: local
      become: false
      run_once: true

    - name: Fail if website/index.html missing on controller
      ansible.builtin.fail:
        msg: "Expected {{ landing_src }}/index.html — create the site under app_dev/website/ first."
      when: not landing_index.stat.exists | default(false)
      delegate_to: localhost
      connection: local
      become: false
      run_once: true

    - name: Ensure static landing asset directories exist (siblings untouched)
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        owner: www-data
        group: www-data
        mode: "0755"
      loop:
        - "{{ dutch_web_root }}/static_landing_css"
        - "{{ dutch_web_root }}/static_landing_js"
        - "{{ dutch_web_root }}/static_landing_images"
        - "{{ dutch_web_root }}/.well-known"
        - "{{ dutch_web_root }}/gotoapp"

    - name: Install index.html
      ansible.builtin.copy:
        src: "{{ landing_src }}/index.html"
        dest: "{{ dutch_web_root }}/index.html"
        owner: www-data
        group: www-data
        mode: "0644"

    - name: Install app-ads.txt (AdMob / App Store verification)
      ansible.builtin.copy:
        src: "{{ landing_src }}/app-ads.txt"
        dest: "{{ dutch_web_root }}/app-ads.txt"
        owner: www-data
        group: www-data
        mode: "0644"

    - name: Install apple-app-site-association (iOS Universal Links)
      ansible.builtin.copy:
        src: "{{ landing_src }}/.well-known/apple-app-site-association"
        dest: "{{ dutch_web_root }}/.well-known/apple-app-site-association"
        owner: www-data
        group: www-data
        mode: "0644"

    - name: Install assetlinks.json (Android App Links)
      ansible.builtin.copy:
        src: "{{ landing_src }}/.well-known/assetlinks.json"
        dest: "{{ dutch_web_root }}/.well-known/assetlinks.json"
        owner: www-data
        group: www-data
        mode: "0644"

    - name: Install gotoapp fallback page (/gotoapp/* when app not installed)
      ansible.builtin.copy:
        src: "{{ landing_src }}/gotoapp/index.html"
        dest: "{{ dutch_web_root }}/gotoapp/index.html"
        owner: www-data
        group: www-data
        mode: "0644"

    - name: Install static landing CSS
      ansible.builtin.copy:
        src: "{{ landing_src }}/static_landing_css/{{ item }}"
        dest: "{{ dutch_web_root }}/static_landing_css/{{ item }}"
        owner: www-data
        group: www-data
        mode: "0644"
      loop:
        - styles.css

    - name: Install static landing JS
      ansible.builtin.copy:
        src: "{{ landing_src }}/static_landing_js/{{ item }}"
        dest: "{{ dutch_web_root }}/static_landing_js/{{ item }}"
        owner: www-data
        group: www-data
        mode: "0644"
      loop:
        - main.js

    - name: Install static landing images (logo + icon)
      ansible.builtin.copy:
        src: "{{ landing_src }}/static_landing_images/{{ item }}"
        dest: "{{ dutch_web_root }}/static_landing_images/{{ item }}"
        owner: www-data
        group: www-data
        mode: "0644"
      loop:
        - logo.webp
        - logo_icon.webp
        - favicon.ico
        - apple-touch-icon.png
