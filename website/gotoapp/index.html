<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="description" content="Open Dutch Card Game to apply your referral code, or download the app." />
  <title>Dutch — Open app</title>
  <link rel="icon" href="/static_landing_images/favicon.ico" sizes="any" />
  <link rel="stylesheet" href="/static_landing_css/styles.css" />
</head>
<body>
  <div class="bg-gradient" aria-hidden="true"></div>
  <header class="site-header">
    <div class="brand">
      <div class="brand-logo">
        <img src="/static_landing_images/logo.webp" alt="Dutch app logo" decoding="async" />
      </div>
      <div>
        <p class="brand-kicker">ReignOfPlay</p>
        <h1 class="brand-title">Dutch</h1>
      </div>
    </div>
    <p class="tagline">Opening Dutch… If nothing happens, install the app and open this link again.</p>
    <nav class="store-links" aria-label="Download Dutch">
      <a class="store-badge store-badge--apple" href="https://apps.apple.com/us/app/dutch-card-game/id6772967073" rel="noopener noreferrer" target="_blank">
        <span class="store-badge__icon" aria-hidden="true">
          <svg viewBox="0 0 24 24" width="22" height="22" fill="currentColor"><path d="M18.71 19.5c-.83 1.24-1.71 2.45-3.05 2.47-1.34.03-1.77-.79-3.29-.79-1.53 0-2 .77-3.27.82-1.31.05-2.3-1.32-3.14-2.53C4.25 17 2.94 12.45 4.7 9.39c.87-1.52 2.43-2.48 4.12-2.51 1.28-.02 2.5.87 3.29.87.78 0 2.26-1.07 3.8-.91.65.03 2.47.26 3.64 1.98-.09.06-2.17 1.28-2.15 3.81.03 3.02 2.65 4.03 2.68 4.04-.03.07-.42 1.44-1.38 2.83M13 3.5c.73-.83 1.94-1.46 2.94-1.5.13 1.17-.34 2.35-1.04 3.19-.69.85-1.83 1.51-2.95 1.42-.15-1.15.41-2.35 1.05-3.11z"/></svg>
        </span>
        <span class="store-badge__text">
          <span class="store-badge__label">Download on the</span>
          <span class="store-badge__name">App Store</span>
        </span>
      </a>
      <a class="store-badge store-badge--google" href="https://play.google.com/store/apps/details?id=com.reignofplay.dutch" rel="noopener noreferrer" target="_blank">
        <span class="store-badge__icon" aria-hidden="true">
          <svg viewBox="0 0 24 24" width="22" height="22" fill="currentColor"><path d="M3.609 1.814L13.792 12 3.61 22.186a1.003 1.003 0 0 1-.41-.875V2.689a1.003 1.003 0 0 1 .409-.875zm12.89 10.893l2.302 2.302-10.937 6.333 8.635-8.635zm3.199-3.198l2.807 1.626a1 1 0 0 1 0 1.73l-2.808 1.626L15.206 12l4.492-4.491zM5.864 2.658L16.8 8.99l-2.303 2.303L5.864 2.658z"/></svg>
        </span>
        <span class="store-badge__text">
          <span class="store-badge__label">Get it on</span>
          <span class="store-badge__name">Google Play</span>
        </span>
      </a>
    </nav>
  </header>
  <main class="content">
    <section class="card">
      <h2>Open in app</h2>
      <p class="muted">This link is for opening Dutch when it is already installed. After install, tap this URL again.</p>
      <p><a id="home-link" href="/">Back to Dutch home</a></p>
    </section>
  </main>
  <script>
    (function () {
      var path = window.location.pathname || "";
      var m = path.match(/^\/gotoapp\/([^\/\?#]+)/i);
      var code = m && m[1] ? decodeURIComponent(m[1]).trim() : "";
      if (!code || code.toLowerCase() === "index.html") return;

      code = code.toUpperCase();
      try { sessionStorage.setItem("dutch_referral_code", code); } catch (e) {}

      var home = document.getElementById("home-link");
      if (home) {
        home.href = "/?ref=" + encodeURIComponent(code);
      }
    })();
  </script>
</body>
</html>
